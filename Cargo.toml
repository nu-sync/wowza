[package]
name = "wowza"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
description = "World of Warcraft Addon Management CLI"
license = "MIT"
repository = "https://github.com/nu-sync/wowza"
readme = "README.md"

[dependencies]
anstream = "1"
clap = { version = "4", features = ["derive"] }
url = "2"
open = "5"

zip = { version = "2", default-features = false, features = ["deflate"] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"

[features]
test-hooks = []
